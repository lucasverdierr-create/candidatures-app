<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Candidatures">
<meta name="theme-color" content="#EDF0F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#091024" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<title>Candidatures</title>
<style>
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --sunk:#E3E7F0; --ink:#0F1A36; --ink-2:#4E5873; --ink-3:#8790A6;
  --line:rgba(15,26,54,.09); --accent:#2747F5; --accent-ink:#FFFFFF;
  --hi:#0FA36B; --mid:#E39A0B; --lo:#98A0B3; --danger:#D23B3B;
  --st-todo:#2747F5; --st-sent:#7A4DF2; --st-itv:#E39A0B; --st-offer:#0FA36B; --st-ko:#D23B3B; --st-out:#98A0B3;
  --display:"Bricolage Grotesque",-apple-system,"SF Pro Display",sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --lift:0 1px 0 rgba(15,26,54,.04),0 8px 24px -12px rgba(15,26,54,.18);
  --next-bg:#0F1A36; --next-ink:#EDF0F6;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#091024; --surface:#121B36; --sunk:#1B2647; --ink:#EEF1FA; --ink-2:#AAB3CC; --ink-3:#6E7895;
    --line:rgba(238,241,250,.08); --accent:#7C93FF; --accent-ink:#081032;
    --hi:#3DDC97; --mid:#FFC14D; --lo:#6E7895; --danger:#FF6B6B;
    --st-todo:#7C93FF; --st-sent:#B497FF; --st-itv:#FFC14D; --st-offer:#3DDC97; --st-ko:#FF6B6B; --st-out:#6E7895;
    --lift:none; --next-bg:#22306A; --next-ink:#EEF1FA; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:contain}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 40px)}

/* ---------- En-tête ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:800 34px/1 var(--display);letter-spacing:-.035em;margin:6px 0 0;font-variation-settings:"opsz" 96}
.lede{color:var(--ink-2);font-size:15px;margin:8px 0 18px}
.lede b{color:var(--accent);font-weight:650}
.tools{display:flex;gap:6px;margin-top:4px}
.tb{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--lift)}
.tb.on{color:var(--accent)}
.tb:active{transform:scale(.94)}

/* ---------- Prochain entretien ---------- */
.next{display:flex;align-items:center;gap:16px;width:100%;border:0;text-align:left;border-radius:var(--r-lg);padding:16px 18px;margin-bottom:16px;
  background:var(--next-bg);color:var(--next-ink);box-shadow:var(--lift)}
.next .cd{font:800 40px/.9 var(--display);letter-spacing:-.04em;color:var(--mid);min-width:64px}
.next .cd small{display:block;font:600 12px/1.2 var(--text);letter-spacing:0;color:var(--next-ink);opacity:.6;margin-top:6px}
.next b{display:block;font-size:16px}
.next span{display:block;font-size:14px;opacity:.72;margin-top:2px}

/* ---------- Recherche + tri ---------- */
.bar{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:var(--r-sm);padding:0 12px;color:var(--ink-3)}
.search input{flex:1;border:0;background:none;padding:11px 0;font-size:16px;outline:none;color:var(--ink);min-width:0}
.sort{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:10px 4px;white-space:nowrap}

/* ---------- Onglets de statut ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px -16px 4px;padding:2px 16px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:8px 14px 8px 12px;background:var(--surface);font-size:14px;font-weight:600;box-shadow:var(--lift)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab .n{color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
.tab[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.tab[aria-pressed=true] .n{color:inherit;opacity:.6}

/* ---------- Cartes ---------- */
.list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.card{position:relative;display:grid;grid-template-columns:66px 1fr;gap:4px 12px;align-items:start;width:100%;border:0;text-align:left;
  background:var(--surface);border-radius:var(--r-lg);padding:16px 16px 16px 14px;box-shadow:var(--lift)}
.card:active{transform:scale(.985)}
.sc{font:800 44px/.85 var(--display);letter-spacing:-.05em;color:var(--t);font-variant-numeric:tabular-nums;font-variation-settings:"opsz" 96}
.sc small{display:block;font:600 11px/1 var(--text);letter-spacing:0;color:var(--ink-3);margin-top:7px}
.card h3{font:700 17px/1.22 var(--display);letter-spacing:-.01em;margin:1px 18px 4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.where{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:14px;color:var(--ink-2)}
.where .co{color:var(--ink);font-weight:550}
.where .loc{display:inline-flex;align-items:center;gap:3px}
.where svg.i{width:13px;height:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--sunk);color:var(--ink-2)}
.chip.new{background:var(--accent);color:var(--accent-ink)}
.chip.itv{background:color-mix(in srgb,var(--st-itv) 20%,transparent);color:color-mix(in srgb,var(--st-itv) 70%,var(--ink))}
.chip.st{background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 80%,var(--ink))}
.card.unseen::after{content:"";position:absolute;top:18px;right:16px;width:9px;height:9px;border-radius:50%;background:var(--accent)}

.empty{text-align:center;color:var(--ink-2);padding:56px 24px}
.empty b{display:block;font:700 20px/1.2 var(--display);color:var(--ink);margin-bottom:6px}
.hint{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;font-size:14px;color:var(--ink-2);margin-bottom:14px;box-shadow:var(--lift)}
.hint b{color:var(--ink)}
.skel{height:96px;border-radius:var(--r-lg);background:linear-gradient(90deg,var(--surface),var(--sunk),var(--surface));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- Fiche ---------- */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;transform:translateX(100%);transition:transform .34s cubic-bezier(.2,.85,.25,1);-webkit-overflow-scrolling:touch}
.sheet.open{transform:none}
.nav{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px 8px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.back{display:flex;align-items:center;gap:2px;border:0;background:none;color:var(--accent);font-size:17px;padding:8px}
.back svg.i{width:24px;height:24px;stroke-width:2.4}
.d{max-width:640px;margin:0 auto;padding:4px 16px calc(env(safe-area-inset-bottom) + 120px)}
.hero{display:flex;align-items:flex-end;gap:6px;margin:4px 0 2px}
.hero .big{font:800 128px/.78 var(--display);letter-spacing:-.065em;color:var(--t);font-variation-settings:"opsz" 96;font-variant-numeric:tabular-nums}
.hero .of{font:700 20px/1 var(--display);color:var(--ink-3);padding-bottom:8px}
.hero .tier{margin-left:auto;align-self:center;font-size:13px;font-weight:650;color:var(--t);background:color-mix(in srgb,var(--t) 13%,transparent);padding:5px 10px;border-radius:999px}
.d h2{font:750 28px/1.1 var(--display);letter-spacing:-.025em;margin:18px 0 8px}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;color:var(--ink-2)}
.facts span{display:inline-flex;align-items:center;gap:5px}
.facts svg.i{width:15px;height:15px;color:var(--ink-3)}
.why{font-size:16px;color:var(--ink);margin:16px 0 0;padding-left:12px;border-left:3px solid var(--t)}

.seg{display:flex;gap:6px;overflow-x:auto;margin:22px -16px 0;padding:2px 16px 6px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:0;border-radius:999px;padding:9px 14px;background:var(--surface);font-size:14px;font-weight:600;box-shadow:var(--lift);display:flex;gap:7px;align-items:center}
.seg button .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.seg button[aria-pressed=true]{background:var(--c);color:#fff;box-shadow:none}
.seg button[aria-pressed=true] .dot{background:#fff}
.since{font-size:13px;color:var(--ink-3);margin:6px 0 0}

.block{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--lift);margin-top:14px;overflow:hidden}
.bh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px 4px}
.bh h3{font:700 17px/1.2 var(--display);letter-spacing:-.01em;margin:0}
.bb{padding:6px 16px 16px;font-size:15.5px;line-height:1.55;white-space:pre-wrap}
.block.feature{background:var(--next-bg);color:var(--next-ink)}
.block.feature .bb{font-size:17px;line-height:1.5}
.block.itv{outline:2px solid var(--st-itv);outline-offset:-2px}
details.block > summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:15px 16px}
details.block > summary::-webkit-details-marker{display:none}
details.block > summary h3{font:700 17px/1.2 var(--display);margin:0}
details.block > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
details[open].block > summary::after{transform:rotate(-135deg)}
details.block .bb{padding-top:0}
.mini{border:0;border-radius:999px;padding:6px 12px;background:var(--sunk);font-size:13px;font-weight:650;color:var(--ink);text-decoration:none;white-space:nowrap}
.mini.ok{background:var(--hi);color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 16px;background:var(--sunk);font-weight:650;font-size:15px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;color:var(--ink-2)}
.btn.danger{background:none;color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row > *{flex:1 1 140px}
textarea,.dt,.field input{width:100%;border:0;border-radius:12px;background:var(--sunk);padding:12px 14px;font-size:16px;outline:none;color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.dt{-webkit-appearance:none;min-height:48px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;padding:6px 16px 16px;font-size:15px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;text-align:right}

/* Barre d'actions fixe */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);
  background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.dock .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
.dock .go{flex:1;font-size:16px;padding:15px}
.dock .sq{flex:0 0 auto;width:58px;padding:0;flex-direction:column;gap:2px;font-size:11px;font-weight:650}
.dock .sq[aria-disabled=true]{opacity:.35;pointer-events:none}

/* ---------- Panneaux ---------- */
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;background:rgba(9,16,36,.42);opacity:0;pointer-events:none;transition:opacity .22s}
.modal.open{opacity:1;pointer-events:auto}
.panel{width:100%;max-width:640px;margin:0 auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow-y:auto;transform:translateY(40px);transition:transform .28s cubic-bezier(.2,.85,.25,1)}
.modal.open .panel{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ink-3);opacity:.35;margin:0 auto 14px}
.panel h2{font:800 26px/1.1 var(--display);letter-spacing:-.03em;margin:0}
.panel .sub{color:var(--ink-2);font-size:15px;margin:6px 0 4px}
.step{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r-md);padding:14px;margin-top:10px;box-shadow:var(--lift)}
.step .num{flex:0 0 32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font:800 15px/1 var(--display)}
.step.done .num{background:var(--hi);color:#fff}
.step .tx{flex:1;min-width:0}.step .tx b{display:block;font-size:15.5px}.step .tx span{font-size:13.5px;color:var(--ink-2)}
.copyrow{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line)}
.copyrow > div{flex:1;min-width:0}
.copyrow .l{font-size:13px;color:var(--ink-3)}
.copyrow .v{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:block;margin-top:12px}.field span{display:block;font-size:13px;color:var(--ink-3);margin-bottom:5px}

/* ---------- Connexion ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:360px;margin:0 auto;padding:24px}
.login img{width:76px;height:76px;border-radius:19px}
.login h1{font-size:44px}
.login input{width:100%;border:0;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--lift);padding:18px;font:700 26px/1 var(--display);text-align:center;letter-spacing:.35em;outline:none;color:var(--ink)}
.err{color:var(--danger);font-size:14px;min-height:20px}

/* ---------- Toast ---------- */
.toast{white-space:nowrap;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translate(-50%,16px);opacity:0;display:flex;align-items:center;gap:14px;
  background:var(--ink);color:var(--bg);padding:11px 12px 11px 16px;border-radius:14px;font-size:14.5px;font-weight:550;transition:.24s;z-index:40;pointer-events:none;max-width:92vw;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:#7C93FF;font-weight:700;padding:2px 4px}
@media (prefers-color-scheme: dark){ .toast button{color:#2747F5} }
.spin{animation:rot .9s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.flash{animation:fl 1.4s ease}@keyframes fl{0%,40%{box-shadow:0 0 0 5px color-mix(in srgb,var(--st-itv) 45%,transparent)}100%{box-shadow:var(--lift)}}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// =============== Configuration ===============
const STATUTS = [
  { k: "À postuler", c: "--st-todo" }, { k: "Postulé", c: "--st-sent" }, { k: "Entretien", c: "--st-itv" },
  { k: "Offre", c: "--st-offer" }, { k: "Refus", c: "--st-ko" }, { k: "Écartée", c: "--st-out" },
];
const stColor = (s) => `var(${(STATUTS.find((x) => x.k === s) || STATUTS[0]).c})`;
const ONGLETS = [
  { k: "À postuler", label: "À postuler" }, { k: "Postulé", label: "Postulé" }, { k: "Entretien", label: "Entretien" },
  { k: "Offre", label: "Offre" }, { k: "__all", label: "Toutes" }, { k: "Écartée", label: "Écartées" },
];
const DEMO = new URLSearchParams(location.search).has("demo");
const isStandalone = () => window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const DEFAULT_ME = { email: "lucas.verdier@hotmail.com", tel: "06 34 25 51 93", linkedin: "linkedin.com/in/lucas-verdier" };

const state = {
  pin: (() => { try { return localStorage.getItem("pin") || ""; } catch { return ""; } })(),
  offres: [], tab: ls.get("tab", "À postuler"), q: "", sort: ls.get("sort", "score"),
  loading: false, current: null, me: { ...DEFAULT_ME, ...ls.get("me", {}) }, seen: ls.get("seen", null), applying: false,
};

// =============== Utilitaires ===============
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const statut = (o) => o.Statut || "À postuler";
const tierColor = (s) => (s >= 75 ? "var(--hi)" : s >= 60 ? "var(--mid)" : "var(--lo)");
const tierLabel = (s) => (s >= 80 ? "Excellent match" : s >= 70 ? "Très bon match" : s >= 60 ? "Bon match" : "Match faible");
const fmtDay = (d) => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
const fmtShort = (d) => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
const itvDate = (o) => (statut(o) === "Entretien" && o["Date entretien"] ? new Date(o["Date entretien"]) : null);
const fmtItv = (d) => d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) + " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
const daysUntil = (d) => { const a = new Date(); a.setHours(0, 0, 0, 0); const b = new Date(d); b.setHours(0, 0, 0, 0); return Math.round((b - a) / 86400000); };
const toLocalInput = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const appliedDate = (o) => (["Postulé", "Entretien", "Offre", "Refus"].includes(statut(o)) ? o["Date de candidature"] : null);
const isNew = (o) => state.seen && !state.seen.includes(o.id) && statut(o) === "À postuler";
function markSeen(id) { if (!state.seen) state.seen = []; if (!state.seen.includes(id)) { state.seen.push(id); ls.set("seen", state.seen.slice(-2000)); } }

const I = {
  back: '<path d="M15 18l-6-6 6-6"/>', refresh: '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>',
  bell: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  doc: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>',
  ext: '<path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>',
  euro: '<path d="M18 7a7 7 0 1 0 0 10"/><path d="M4 10h10M4 14h10"/>', brief: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',

async function copy(text, btn) {

  catch { const t = document.createElement("textarea"); t.value = text; t.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  if (btn) { const old = btn.textContent; btn.textContent = "Copié"; btn.classList.add("ok"); setTimeout(() => { btn.textContent = old; btn.classList.remove("ok"); }, 1400); }

async function api(path, opts = {}) {
  if (DEMO) return demoApi(path, opts);
  const res = await fetch(path, { ...opts, headers: { "content-type": "application/json", "x-app-pin": state.pin, ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { logout(); throw new Error("Code d'accès invalide"); }

// Règles de cohérence lors d'un changement de statut
function fieldsForStatut(o, s) {
  const f = { Statut: s };
  if (["Postulé", "Entretien", "Offre"].includes(s) && !o["Date de candidature"]) f["Date de candidature"] = today();
  if (["À postuler", "Écartée"].includes(s) && o["Date de candidature"]) f["Date de candidature"] = "";
  if (!["Entretien", "Offre"].includes(s) && o["Date entretien"]) f["Date entretien"] = "";
  return f;
}
function setStatut(id, s) {
  const o = state.offres.find((x) => x.id === id);
  if (!o || statut(o) === s) return;
  const f = fieldsForStatut(o, s), before = {};
  Object.keys(f).forEach((k) => (before[k] = o[k] ?? ""));
  if (!o.Statut) before.Statut = "À postuler";
  save(id, f, `Statut : ${s}`, { undo: () => save(id, before, "Modification annulée"), focusItv: s === "Entretien" });
}
function applyLocal(id, fields) {
  const i = state.offres.findIndex((x) => x.id === id);
  if (i < 0) return;
  const o = { ...state.offres[i] };
  for (const [k, v] of Object.entries(fields)) { if (v === "" || v == null) delete o[k]; else o[k] = v; }
  state.offres[i] = o;
}
async function save(id, fields, msg, opts = {}) {
  const snapshot = state.offres.map((o) => ({ ...o }));
  applyLocal(id, fields); // mise à jour instantanée à l'écran
  if (state.current === id) openDetail(id, opts.focusItv); else render();
  toast(msg, opts.undo);
  try {
    const { offre } = await api("/api/offre-update", { method: "POST", body: JSON.stringify({ id, fields }) });
    const i = state.offres.findIndex((x) => x.id === id);
    // la fiche renvoyée par Airtable remplace entièrement l'ancienne (les champs vidés disparaissent bien)
    if (i >= 0 && offre) state.offres[i] = { ...offre, createdTime: offre.createdTime || state.offres[i].createdTime };
  } catch (e) {
    state.offres = snapshot;
    if (state.current === id) openDetail(id); else render();
    toast("Pas enregistré : " + e.message);
  }
}

async function openFromUrl() {
  const id = new URLSearchParams(location.search).get("id");
  if (!id) return;
  if (!state.offres.find((o) => o.id === id)) { try { const { offre } = await api("/api/offres?id=" + id); if (offre) state.offres.unshift(offre); } catch {} }
  openDetail(id);
}

  $$("[data-step]", m).forEach((b) => (b.onclick = (e) => { if (b.dataset.step === "msg") { e.preventDefault(); copy(o["Message candidature"], b); } done(b.dataset.step); }));
  $$("[data-val]", m).forEach((b) => (b.onclick = () => copy(b.dataset.val, b)));
  $("#editMe").onclick = openMe;
  const da = $("#didApply"); if (da) da.onclick = () => { closeModal(); setStatut(o.id, "Postulé"); };
  $("#later").onclick = closeModal;
}

function openMe() {
  const me = state.me;
  modal(`
    <h2>Tes coordonnées</h2>
    <p class="sub">Proposées à copier quand tu postules. Elles restent sur ce téléphone.</p>
    <label class="field"><span>E-mail</span><input id="me-email" type="email" autocomplete="email" value="${esc(me.email)}"></label>
    <label class="field"><span>Téléphone</span><input id="me-tel" type="tel" autocomplete="tel" value="${esc(me.tel)}"></label>
    <label class="field"><span>LinkedIn</span><input id="me-linkedin" type="url" value="${esc(me.linkedin)}"></label>
    <button class="btn primary" style="width:100%;margin-top:18px;padding:15px" id="saveMe">Enregistrer</button>`);
  $("#saveMe").onclick = () => {
    state.me = { email: $("#me-email").value.trim(), tel: $("#me-tel").value.trim(), linkedin: $("#me-linkedin").value.trim() };
    ls.set("me", state.me); closeModal(); toast("Coordonnées enregistrées");
  };
}

// =============== Notifications ===============
function b64ToUint8(b64) { const p = "=".repeat((4 - (b64.length % 4)) % 4); const raw = atob((b64 + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(raw, (c) => c.charCodeAt(0)); }
async function enableNotifications() {
  if (DEMO) return toast("Notifications indisponibles en démo");
  if (!isStandalone()) return toast("Ajoute d'abord l'app à l'écran d'accueil, puis ouvre-la depuis l'icône");
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return toast("Mets ton iPhone à jour (iOS 16.4 minimum)");
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") return toast("Notifications refusées : Réglages, Notifications, Candidatures");
    const reg = await navigator.serviceWorker.ready;
    const { publicKey } = await api("/api/push-config");
    if (!publicKey) return toast("Clé de notification manquante sur Netlify");
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToUint8(publicKey) }));
    await api("/api/subscribe", { method: "POST", body: JSON.stringify({ subscription: sub }) });
    toast("Notifications activées"); render();
  } catch (e) { toast("Activation impossible : " + e.message); }
}
