<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Candidatures">
<meta name="theme-color" content="#F4F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Candidatures</title>
<style>
:root{
  --bg:#F4F2EC; --surface:#FFFFFF; --surface-2:#ECE9E1; --ink:#1B1C1A; --ink-2:#5E605A; --ink-3:#8E9089;
  --line:rgba(27,28,26,.10); --accent:#1F4D3A; --accent-ink:#FFFFFF;
  --hi:#2E7D55; --mid:#C98A1E; --lo:#9A9C95; --danger:#B3402E;
  --radius:18px; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141513; --surface:#1E1F1C; --surface-2:#2A2B27; --ink:#F1F0EA; --ink-2:#B0B1AA; --ink-3:#7E8079;
    --line:rgba(255,255,255,.09); --accent:#7CC4A0; --accent-ink:#0E1F17; --hi:#6FCB97; --mid:#E8B04F; --lo:#7E8079;
    --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:contain}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 32px)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 14px}
h1{font:700 34px/1.1 -apple-system,"SF Pro Display",sans-serif;letter-spacing:-.02em;margin:0}
.sub{color:var(--ink-2);font-size:14px;margin-top:4px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);
  display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.on svg{stroke:var(--accent)}
.actions{display:flex;gap:8px}
.search{width:100%;border:0;border-radius:12px;background:var(--surface-2);padding:10px 14px;font-size:16px;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;border-radius:999px;padding:7px 14px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:500;cursor:pointer}
.chip .n{color:var(--ink-3);margin-left:4px;font-weight:400}
.chip.active{background:var(--ink);color:var(--bg)} .chip.active .n{color:inherit;opacity:.6}
.list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.card{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);
  border:0;text-align:left;width:100%;cursor:pointer}
.card:active{transform:scale(.99)}
.score{flex:0 0 52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-2) 0)}
.score span{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.card .t{font-weight:600;font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{color:var(--ink-2);font-size:14px;margin-top:3px}
.card .tags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.tag.st{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.empty{text-align:center;color:var(--ink-2);padding:60px 20px}
.banner{background:var(--surface);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);font-size:14px;color:var(--ink-2);margin-bottom:10px}
.banner b{color:var(--ink)}
/* Détail */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  -webkit-overflow-scrolling:touch}
.sheet.open{transform:none}
.sheet .bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.back{border:0;background:none;color:var(--accent);font-size:17px;display:flex;align-items:center;gap:2px;padding:8px;cursor:pointer}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4}
.d{max-width:640px;margin:0 auto;padding:4px 16px calc(env(safe-area-inset-bottom) + 40px)}
.d h2{font:700 26px/1.15 -apple-system,"SF Pro Display",sans-serif;letter-spacing:-.015em;margin:4px 0 6px}
.d .co{color:var(--ink-2);font-size:15px}
.hero{display:flex;align-items:center;gap:14px;margin:16px 0}
.hero .score{flex-basis:64px;height:64px;font-size:20px}.hero .score span{width:52px;height:52px}
.why{color:var(--ink-2);font-size:15px}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:14px 0 6px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px;background:var(--surface);
  box-shadow:var(--shadow);font-weight:600;font-size:15px;text-decoration:none;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.group{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.group h3{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin:0;padding:14px 16px 4px}
.group .c{padding:4px 16px 14px;font-size:15px;white-space:pre-wrap;line-height:1.5}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:4px 16px 14px;font-size:15px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;text-align:right}
.status{display:flex;gap:6px;flex-wrap:wrap;padding:6px 16px 14px}
.status button{border:0;border-radius:999px;padding:7px 12px;background:var(--surface-2);font-size:14px;cursor:pointer}
.status button.active{background:var(--accent);color:var(--accent-ink);font-weight:600}
textarea{width:100%;min-height:110px;border:0;border-radius:12px;background:var(--surface-2);padding:12px;font-size:16px;resize:vertical;outline:none}
.save{margin-top:8px;width:100%}
.pitch .c{font-size:16px;font-style:italic}
details.group summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding-right:16px}
details.group summary::-webkit-details-marker{display:none}
details.group summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin-bottom:4px}
details[open].group summary::after{transform:rotate(-135deg);margin-bottom:-4px}
/* Connexion */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:360px;margin:0 auto;padding:24px}
.login img{width:72px;height:72px;border-radius:18px}
.login input{width:100%;border:0;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:16px;font-size:22px;text-align:center;letter-spacing:.3em;outline:none}
.err{color:var(--danger);font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;transition:.25s;z-index:20;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.skeleton{height:84px;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.spin{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.tag.itv{background:color-mix(in srgb,var(--mid) 18%,transparent);color:var(--mid);font-weight:600}
.next{display:flex;gap:12px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border:0;width:100%;text-align:left;cursor:pointer}
.next .j{flex:0 0 auto;font:700 22px/1 -apple-system,"SF Pro Display",sans-serif;text-align:center;min-width:44px}
.next .j small{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:2px}
.next b{display:block}.next span{font-size:14px;opacity:.85}
.dt{width:100%;border:0;border-radius:12px;background:var(--surface-2);padding:12px;font-size:16px;outline:none;-webkit-appearance:none;min-height:46px}
.tag.new{background:var(--accent);color:var(--accent-ink);font-weight:600}
.card.unseen .t::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin:0 6px 2px 0;vertical-align:middle}
.copyrow{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line)}
.copyrow:first-of-type{border-top:0}
.copyrow .lbl{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.copyrow .val{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copyrow > div{flex:1;min-width:0}
.mini{text-decoration:none;border:0;border-radius:999px;padding:6px 12px;background:var(--surface-2);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);flex:0 0 auto}
.mini.ok{background:var(--accent);color:var(--accent-ink)}
.gh{display:flex;justify-content:space-between;align-items:center;padding-right:12px}
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.panel{width:100%;max-width:640px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 20px);
  max-height:92vh;overflow-y:auto;transform:translateY(30px);transition:transform .25s}
.modal.open .panel{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.panel h2{font:700 22px/1.2 -apple-system,"SF Pro Display",sans-serif;margin:0 0 4px}
.step{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-top:10px}
.step .num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:14px}
.step.done .num{background:var(--accent);color:var(--accent-ink)}
.step .tx{flex:1;min-width:0}.step .tx b{display:block;font-size:15px}.step .tx span{font-size:13px;color:var(--ink-2)}
.field{display:block;margin-top:12px}.field span{font-size:13px;color:var(--ink-3)}
.field input{width:100%;border:0;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);padding:12px;font-size:16px;outline:none;margin-top:4px}

</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ---------- Configuration ----------
const STATUTS = ["À postuler", "Postulé", "Entretien", "Offre", "Refus", "Écartée"];
const FILTRES = [
  { k: "À postuler", label: "À postuler" },
  { k: "Postulé", label: "Postulé" },
  { k: "Entretien", label: "Entretien" },
  { k: "__actives", label: "Toutes actives" },
  { k: "Écartée", label: "Écartées" },
];
const DEMO = new URLSearchParams(location.search).has("demo");
const isStandalone = () => window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;

const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const DEFAULT_ME = { email: "lucas.verdier@hotmail.com", tel: "06 34 25 51 93", linkedin: "linkedin.com/in/lucas-verdier", ville: "Amiens (80)" };
const state = { pin: localStorage.getItem("pin") || "", offres: [], filtre: "À postuler", q: "", loading: false, current: null,
  me: { ...DEFAULT_ME, ...ls.get("me", {}) }, seen: ls.get("seen", null), applyFor: null };

// ---------- Utilitaires ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const scoreColor = (s) => (s >= 75 ? "var(--hi)" : s >= 60 ? "var(--mid)" : "var(--lo)");
const fmtDate = (d) => (d ? new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) : "");
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  if (btn) { const old = btn.textContent; btn.textContent = "Copié ✓"; btn.classList.add("ok"); setTimeout(() => { btn.textContent = old; btn.classList.remove("ok"); }, 1500); }
  else toast("Copié");
}
const itvDate = (o) => (o["Date entretien"] ? new Date(o["Date entretien"]) : null);
const fmtItv = (d) => d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) + " · " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
const daysUntil = (d) => { const a = new Date(); a.setHours(0, 0, 0, 0); const b = new Date(d); b.setHours(0, 0, 0, 0); return Math.round((b - a) / 86400000); };
const toLocalInput = (d) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 16); };
function nextInterview() {
  return state.offres.map((o) => ({ o, d: itvDate(o) })).filter((x) => x.d && daysUntil(x.d) >= 0 && !["Refus", "Écartée"].includes(x.o.Statut))
    .sort((a, b) => a.d - b.d)[0];
}
const isNew = (o) => state.seen && !state.seen.includes(o.id) && (o.Statut || "À postuler") === "À postuler";
function markSeen(id) { if (!state.seen) state.seen = []; if (!state.seen.includes(id)) { state.seen.push(id); ls.set("seen", state.seen.slice(-2000)); } }
const ICON = {
  user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  refresh: '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>',
  bell: '<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
};

async function api(path, opts = {}) {
  if (DEMO) return demoApi(path, opts);
  const res = await fetch(path, { ...opts, headers: { "content-type": "application/json", "x-app-pin": state.pin, ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { logout(); throw new Error("Code d'accès invalide"); }
  if (!res.ok) throw new Error(data.error || "Erreur réseau");
  return data;
}

// ---------- Connexion ----------
function renderLogin(err = "") {
  $("#app").innerHTML = `
    <form class="login" id="login">
      <img src="/icons/apple-touch-icon.png" alt="">
      <h1>Candidatures</h1>
      <div class="sub">Entre ton code d'accès pour voir tes offres.</div>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••" required>
      <div class="err">${esc(err)}</div>
      <button class="btn primary" type="submit">Ouvrir</button>
    </form>`;
  $("#login").onsubmit = async (e) => {
    e.preventDefault();
    state.pin = $("#pin").value.trim();
    try { await load(true); localStorage.setItem("pin", state.pin); render(); openFromUrl(); }
    catch (er) { renderLogin(er.message); }
  };
}
function logout() { localStorage.removeItem("pin"); state.pin = ""; renderLogin("Reconnecte-toi avec ton code."); }

// ---------- Données ----------
async function load(silent = false) {
  state.loading = true; if (!silent) render();
  try { const { offres } = await api("/api/offres"); state.offres = offres || [];
    if (state.seen === null) { state.seen = state.offres.map((o) => o.id); ls.set("seen", state.seen); } }
  finally { state.loading = false; }
}

function filtered() {
  const q = state.q.toLowerCase();
  return state.offres.filter((o) => {
    const st = o.Statut || "À postuler";
    const okF = state.filtre === "__actives" ? !["Écartée", "Refus"].includes(st) : st === state.filtre;
    const okQ = !q || [o["Intitulé"], o.Entreprise, o.Ville].join(" ").toLowerCase().includes(q);
    return okF && okQ;
  });
}
const count = (k) => state.offres.filter((o) => { const st = o.Statut || "À postuler"; return k === "__actives" ? !["Écartée", "Refus"].includes(st) : st === k; }).length;

// ---------- Liste ----------
function render() {
  if (!state.pin && !DEMO) return renderLogin();
  const items = filtered();
  const notifOn = typeof Notification !== "undefined" && Notification.permission === "granted";
  $("#app").innerHTML = `
  <div class="wrap">
    <div class="top">
      <div><h1>Candidatures</h1><div class="sub">${(() => { const n = state.offres.filter(isNew).length; return n ? `<b style="color:var(--accent)">${n} nouvelle${n > 1 ? "s" : ""}</b> · ` : ""; })()}${state.offres.length} offres suivies</div></div>
      <div class="actions">
        <button class="icon-btn" id="me" aria-label="Mes infos">${ICON.user}</button>
        <button class="icon-btn ${notifOn ? "on" : ""}" id="bell" aria-label="Notifications">${ICON.bell}</button>
        <button class="icon-btn" id="refresh" aria-label="Actualiser">${ICON.refresh}</button>
      </div>
    </div>
    ${!isStandalone() && !DEMO ? `<div class="banner"><b>Installe l'app</b> pour recevoir les notifications : bouton Partager <span aria-hidden="true">⬆︎</span> puis « Sur l'écran d'accueil ».</div>` : ""}
    ${(() => { const n = nextInterview(); if (!n) return ""; const j = daysUntil(n.d);
      return `<button class="next" data-id="${n.o.id}"><div class="j">${j === 0 ? "Auj." : "J-" + j}<small>${j === 0 ? "" : j === 1 ? "demain" : "jours"}</small></div><div><b>Entretien · ${esc(n.o.Entreprise || "")}</b><span>${esc(fmtItv(n.d))} — ${esc(n.o["Intitulé"] || "")}</span></div></button>`; })()}
    <input class="search" id="q" type="search" placeholder="Rechercher un poste, une entreprise…" value="${esc(state.q)}">
    <div class="chips">${FILTRES.map((f) => `<button class="chip ${state.filtre === f.k ? "active" : ""}" data-f="${f.k}">${f.label}<span class="n">${count(f.k)}</span></button>`).join("")}</div>
    <div class="list">
      ${state.loading && !state.offres.length ? '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>'
        : items.length ? items.map(card).join("") : '<div class="empty">Aucune offre ici pour l\'instant.</div>'}
    </div>
  </div>`;
  $("#q").oninput = (e) => { state.q = e.target.value; const pos = e.target.selectionStart; render(); const i = $("#q"); i.focus(); i.setSelectionRange(pos, pos); };
  document.querySelectorAll(".chip").forEach((b) => (b.onclick = () => { state.filtre = b.dataset.f; render(); }));
  document.querySelectorAll(".card, .next").forEach((b) => (b.onclick = () => openDetail(b.dataset.id)));
  $("#refresh").onclick = async () => { $("#refresh svg").classList.add("spin"); try { await load(true); toast("À jour"); } catch (e) { toast(e.message); } render(); };
  $("#bell").onclick = enableNotifications;
  $("#me").onclick = openMe;
}

function card(o) {
  const s = Number(o.Score) || 0;
  return `<button class="card ${isNew(o) ? "unseen" : ""}" data-id="${o.id}">
    <div class="score" style="--p:${s};--c:${scoreColor(s)}"><span>${s}</span></div>
    <div style="min-width:0">
      <div class="t">${esc(o["Intitulé"] || "Sans titre")}</div>
      <div class="m">${esc(o.Entreprise || "")}${o.Ville ? " · " + esc(o.Ville) : ""}</div>
      <div class="tags">
        ${isNew(o) ? '<span class="tag new">Nouveau</span>' : ""}
        ${itvDate(o) && daysUntil(itvDate(o)) >= 0 ? `<span class="tag itv">Entretien ${esc(fmtItv(itvDate(o)))}</span>` : ""}
        ${o.Source ? `<span class="tag">${esc(o.Source)}</span>` : ""}
        ${o.Salaire ? `<span class="tag">${esc(o.Salaire)}</span>` : ""}
        ${o["Date de candidature"] ? `<span class="tag st">Postulé le ${fmtDate(o["Date de candidature"])}</span>` : ""}
      </div>
    </div></button>`;
}

// ---------- Fiche ----------
function copySection(title, text, key) {
  return text ? `<div class="group"><div class="gh"><h3>${title}</h3><button class="mini" data-copy="${key}">Copier</button></div><div class="c">${esc(text)}</div></div>` : "";
}
function section(title, text, cls = "") { return text ? `<div class="group ${cls}"><h3>${title}</h3><div class="c">${esc(text)}</div></div>` : ""; }
function fold(title, text) { return text ? `<details class="group"><summary><h3>${title}</h3></summary><div class="c">${esc(text)}</div></details>` : ""; }
const link = (href, label, primary) => `<a class="btn ${primary ? "primary" : ""}" ${href ? `href="${esc(href)}" target="_blank" rel="noopener"` : 'aria-disabled="true"'}>${label}</a>`;

function openDetail(id) {
  const o = state.offres.find((x) => x.id === id);
  if (!o) return;
  state.current = o;
  markSeen(id);
  history.replaceState(null, "", "?id=" + id + (DEMO ? "&demo" : ""));
  let sh = $("#sheet");
  if (!sh) { sh = document.createElement("div"); sh.id = "sheet"; sh.className = "sheet"; document.body.appendChild(sh); }
  const s = Number(o.Score) || 0, st = o.Statut || "À postuler";
  const phone = (o["Contact recruteur"] || "").match(/(\+33|0)[1-9](?:[\s.-]?\d{2}){4}/);
  sh.innerHTML = `
    <div class="bar"><button class="back" id="back">${ICON.back}Offres</button></div>
    <div class="d">
      <h2>${esc(o["Intitulé"])}</h2>
      <div class="co">${esc(o.Entreprise || "")}${o.Ville ? " · " + esc(o.Ville) : ""}${o.Contrat ? " · " + esc(o.Contrat) : ""}</div>
      <div class="hero">
        <div class="score" style="--p:${s};--c:${scoreColor(s)}"><span>${s}</span></div>
        <div class="why">${esc(o.Pourquoi || "")}</div>
      </div>
      <div class="btns">
        <button class="btn primary" id="apply">Postuler</button>
        ${link(o.Lien, "Voir l'offre")}
        ${link(o["CV PDF"] || o["Lien CV"], o["CV PDF"] ? "CV (PDF)" : "CV adapté")}
        ${o["CV PDF"] && o["Lien CV"] ? link(o["Lien CV"], "Modifier le CV") : ""}
        ${phone ? `<a class="btn" href="tel:${phone[0].replace(/[\s.-]/g, "")}">Appeler</a>` : ""}
      </div>

      <div class="group"><h3>Statut</h3>
        <div class="status">${STATUTS.map((x) => `<button data-s="${x}" class="${x === st ? "active" : ""}">${x}</button>`).join("")}</div>
      </div>

      <div class="group"><h3>Entretien</h3>
        <div class="c" style="white-space:normal">
          ${itvDate(o) ? `<div style="margin-bottom:10px"><b>${esc(fmtItv(itvDate(o)))}</b>${daysUntil(itvDate(o)) >= 0 ? ` <span class="tag itv">${daysUntil(itvDate(o)) === 0 ? "aujourd'hui" : "dans " + daysUntil(itvDate(o)) + " j"}</span>` : ""}</div>` : '<div class="sub" style="margin:0 0 10px">Ajoute la date pour être prévenu à J-3 et la veille.</div>'}
          <input class="dt" id="itv" type="datetime-local" value="${itvDate(o) ? toLocalInput(itvDate(o)) : ""}">
          <div class="btns" style="margin:10px 0 0">
            <button class="btn primary" id="saveItv">${itvDate(o) ? "Modifier la date" : "Enregistrer la date"}</button>
            ${itvDate(o) && !DEMO ? `<a class="btn" href="/api/ics?id=${o.id}&k=${encodeURIComponent(state.pin)}">Ajouter au calendrier</a>` : ""}
            ${itvDate(o) ? `<button class="btn" id="clearItv" style="color:var(--danger)">Supprimer</button>` : ""}
          </div>
        </div>
      </div>

      ${copySection("Message de candidature", o["Message candidature"], "msg")}
      ${section("Pitch 30 s", o["Pitch 30 s"], "pitch")}
      ${section("Atouts à mettre en avant", o["Atouts à mettre en avant"])}
      ${section("Points à préparer", o["Points à préparer"])}
      ${section("Questions à poser", o["Questions à poser"])}

      <div class="group"><h3>Notes d'appels</h3>
        <div class="c" style="white-space:normal">
          <textarea id="notes" placeholder="Qui a appelé, ce qui s'est dit, prochaine étape…">${esc(o["Notes d'appels"] || "")}</textarea>
          <button class="btn primary save" id="saveNotes">Enregistrer les notes</button>
        </div>
      </div>

      ${o["Lettre de motivation"] ? `<details class="group"><summary><h3>Lettre de motivation</h3></summary><div class="c">${esc(o["Lettre de motivation"])}</div><div style="padding:0 16px 14px"><button class="btn" style="width:100%" data-copy="lettre">Copier la lettre</button></div></details>` : ""}
      ${fold("L'entreprise", o["Présentation entreprise"])}
      ${fold("Missions", o.Missions)}
      ${fold("Profil recherché", o["Profil recherché"])}
      ${section("Contact recruteur", o["Contact recruteur"])}

      <div class="group"><h3>Infos</h3><dl class="kv">
        ${o.Source ? `<dt>Source</dt><dd>${esc(o.Source)}</dd>` : ""}
        ${o.Salaire ? `<dt>Salaire</dt><dd>${esc(o.Salaire)}</dd>` : ""}
        <dt>Détectée le</dt><dd>${fmtDate(o["Détectée le"] || o.createdTime)}</dd>
        ${o["Date de candidature"] ? `<dt>Candidature</dt><dd>${fmtDate(o["Date de candidature"])}</dd>` : ""}
      </dl></div>
    </div>`;
  requestAnimationFrame(() => sh.classList.add("open"));
  sh.scrollTop = 0;
  $("#back").onclick = closeDetail;
  sh.querySelectorAll(".status button").forEach((b) => (b.onclick = () => updateStatut(o, b.dataset.s)));
  $("#saveNotes").onclick = () => save(o, { "Notes d'appels": $("#notes").value }, "Notes enregistrées");
  $("#apply").onclick = () => openApply(o);
  $("#saveItv").onclick = () => {
    const v = $("#itv").value;
    if (!v) return toast("Choisis une date et une heure");
    const fields = { "Date entretien": new Date(v).toISOString() };
    if (!["Entretien", "Offre"].includes(o.Statut)) fields.Statut = "Entretien";
    save(o, fields, "Entretien enregistré · rappel à J-3");
  };
  const clr = $("#clearItv"); if (clr) clr.onclick = () => save(o, { "Date entretien": "" }, "Date supprimée");
  const copyMap = { msg: o["Message candidature"], lettre: o["Lettre de motivation"] };
  sh.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = (e) => { e.preventDefault(); copy(copyMap[b.dataset.copy] || "", b); }));
}
function closeDetail() { const sh = $("#sheet"); if (sh) sh.classList.remove("open"); state.current = null; history.replaceState(null, "", DEMO ? "?demo" : "/"); render(); }

async function updateStatut(o, s) {
  const fields = { Statut: s };
  if (s === "Postulé" && !o["Date de candidature"]) fields["Date de candidature"] = new Date().toISOString().slice(0, 10);
  await save(o, fields, `Statut : ${s}`);
}
async function save(o, fields, msg) {
  try {
    const { offre } = await api("/api/offre-update", { method: "POST", body: JSON.stringify({ id: o.id, fields }) });
    const i = state.offres.findIndex((x) => x.id === o.id);
    state.offres[i] = { ...state.offres[i], ...offre };
    toast(msg); openDetail(o.id);
  } catch (e) { toast(e.message); }
}

async function openFromUrl() {
  const id = new URLSearchParams(location.search).get("id");
  if (!id) return;
  if (!state.offres.find((o) => o.id === id)) {
    try { const { offre } = await api("/api/offres?id=" + id); if (offre) state.offres.unshift(offre); } catch {}
  }
  openDetail(id);
}

// ---------- Postuler (parcours guidé) ----------
function modal(html) {
  let m = $("#modal");
  if (!m) { m = document.createElement("div"); m.id = "modal"; m.className = "modal"; document.body.appendChild(m);
    m.addEventListener("click", (e) => { if (e.target === m) closeModal(); }); }
  m.innerHTML = `<div class="panel"><div class="grab"></div>${html}</div>`;
  requestAnimationFrame(() => m.classList.add("open"));
  return m;
}
function closeModal() { const m = $("#modal"); if (m) m.classList.remove("open"); }

function openApply(o) {
  state.applyFor = o.id;
  const cv = o["CV PDF"] || o["Lien CV"];
  const me = state.me;
  const steps = [
    cv ? { k: "cv", t: "Enregistrer mon CV", s: "Ouvre le PDF → Partager → Enregistrer dans Fichiers", a: `<a class="mini" href="${esc(cv)}" target="_blank" rel="noopener" data-step="cv">Ouvrir</a>` } : null,
    o["Message candidature"] ? { k: "msg", t: "Copier mon message", s: "À coller dans le champ « message » du formulaire", a: `<button class="mini" data-step="msg">Copier</button>` } : null,
    { k: "offre", t: "Ouvrir l'annonce et postuler", s: "Joins le CV depuis Fichiers › Récents", a: o.Lien ? `<a class="mini" href="${esc(o.Lien)}" target="_blank" rel="noopener" data-step="offre">Ouvrir</a>` : `<span class="mini" style="opacity:.4">Pas de lien</span>` },
  ].filter(Boolean);
  const m = modal(`
    <h2>Postuler</h2>
    <div class="sub">${esc(o["Intitulé"] || "")} · ${esc(o.Entreprise || "")}</div>
    ${steps.map((st, i) => `<div class="step" data-k="${st.k}"><div class="num">${i + 1}</div><div class="tx"><b>${st.t}</b><span>${st.s}</span></div>${st.a}</div>`).join("")}
    <div class="group" style="margin-top:14px"><h3>Mes infos à copier</h3>
      ${[["E-mail", me.email], ["Téléphone", me.tel], ["LinkedIn", me.linkedin]].filter((x) => x[1]).map(([l, v]) =>
        `<div class="copyrow"><div><div class="lbl">${l}</div><div class="val">${esc(v)}</div></div><button class="mini" data-val="${esc(v)}">Copier</button></div>`).join("")}
    </div>
    <button class="btn primary" style="width:100%;margin-top:16px" id="didApply">J'ai postulé ✓</button>
    <button class="btn" style="width:100%;margin-top:8px;box-shadow:none;background:none;color:var(--ink-2)" id="cancelApply">Plus tard</button>`);
  const done = (k) => { const el = m.querySelector(`.step[data-k="${k}"]`); if (el) el.classList.add("done"); };
  m.querySelectorAll("[data-step]").forEach((b) => (b.onclick = (e) => {
    const k = b.dataset.step;
    if (k === "msg") { e.preventDefault(); copy(o["Message candidature"], b); }
    done(k);
  }));
  m.querySelectorAll("[data-val]").forEach((b) => (b.onclick = () => copy(b.dataset.val, b)));
  $("#didApply").onclick = async () => { closeModal(); state.applyFor = null; if ((o.Statut || "À postuler") !== "Postulé") await updateStatut(o, "Postulé"); };
  $("#cancelApply").onclick = () => { closeModal(); state.applyFor = null; };
}

function openMe() {
  const me = state.me;
  modal(`
    <h2>Mes infos</h2>
    <div class="sub">Proposées à copier au moment de postuler. Enregistrées sur ce téléphone.</div>
    <label class="field"><span>E-mail</span><input id="me-email" type="email" value="${esc(me.email)}"></label>
    <label class="field"><span>Téléphone</span><input id="me-tel" type="tel" value="${esc(me.tel)}"></label>
    <label class="field"><span>LinkedIn</span><input id="me-linkedin" type="url" value="${esc(me.linkedin)}"></label>
    <button class="btn primary" style="width:100%;margin-top:16px" id="saveMe">Enregistrer</button>`);
  $("#saveMe").onclick = () => {
    state.me = { ...state.me, email: $("#me-email").value.trim(), tel: $("#me-tel").value.trim(), linkedin: $("#me-linkedin").value.trim() };
    ls.set("me", state.me); closeModal(); toast("Infos enregistrées");
  };
}

// ---------- Notifications ----------
function b64ToUint8(b64) { const p = "=".repeat((4 - (b64.length % 4)) % 4); const raw = atob((b64 + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(raw, (c) => c.charCodeAt(0)); }
async function enableNotifications() {
  if (DEMO) return toast("Notifications indisponibles en mode démo");
  if (!isStandalone()) return toast("Ajoute d'abord l'app à l'écran d'accueil, puis ouvre-la depuis l'icône");
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return toast("Mets ton iPhone à jour (iOS 16.4 minimum)");
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") return toast("Notifications refusées — Réglages › Notifications › Candidatures");
    const reg = await navigator.serviceWorker.ready;
    const { publicKey } = await api("/api/push-config");
    if (!publicKey) return toast("Clé VAPID manquante sur Netlify");
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToUint8(publicKey) }));
    await api("/api/subscribe", { method: "POST", body: JSON.stringify({ subscription: sub }) });
    toast("Notifications activées ✓"); render();
  } catch (e) { toast("Échec : " + e.message); }
}

    { id: "recDEMO0000000003", Score: 66, "Intitulé": "Chargé d'acquisition digital SEO", Entreprise: "Groupe Lebrun", Ville: "Arques", Source: "Indeed", Contrat: "CDI", Salaire: "dès 28 k€", Statut: "À postuler", Lien: "#", Pourquoi: "Multi-marques SEA + SEO comme ton poste actuel ; Amazon Ads manquant." },
    { id: "recDEMO0000000004", Score: 41, "Intitulé": "Social Media Manager", Entreprise: "Alice Délice", Ville: "Villeneuve-d'Ascq", Source: "HelloWork", Contrat: "CDI", Statut: "Écartée", Pourquoi: "Poste centré réseaux sociaux, peu d'acquisition." },
  ];
  if (path.startsWith("/api/offres")) { if (state.seen === null) state.seen = ["recDEMO0000000002", "recDEMO0000000004"]; return Promise.resolve({ offres: window._demo }); }
  if (path === "/api/offre-update") { const b = JSON.parse(opts.body); const o = window._demo.find((x) => x.id === b.id); Object.assign(o, b.fields); return Promise.resolve({ offre: o }); }
  return Promise.resolve({});
}

// ---------- Démarrage ----------
if ("serviceWorker" in navigator && !DEMO) navigator.serviceWorker.register("/sw.js").catch(() => {});
document.addEventListener("visibilitychange", () => { if (!document.hidden && (state.pin || DEMO) && !state.current && !state.applyFor) load(true).then(render).catch(() => {}); });
(async () => {
  if (!state.pin && !DEMO) return renderLogin();
  render();
  try { await load(true); } catch (e) { if (state.pin) toast(e.message); }
  render(); openFromUrl();
})();
</script>
