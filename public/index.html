<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Candidatures">
<meta name="theme-color" content="#ECEEF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060918" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<title>Candidatures</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#ECEEF8; --card:rgba(255,255,255,.66); --card-hi:rgba(255,255,255,.86); --edge:rgba(255,255,255,.9);
  --hair:rgba(16,20,43,.08); --sunk:rgba(16,20,43,.055); --track:rgba(16,20,43,.09);
  --ink:#10142B; --ink-2:#545A78; --ink-3:#8B90AA;
  --a1:#4B5BFF; --a2:#9A5BFF; --a3:#12BFD8;
  --grad:linear-gradient(120deg,#4B5BFF 0%,#8B4DFF 58%,#10B4CE 120%);
  --hi:#0EB57E; --mid:#EE9708; --lo:#97A0B8; --danger:#E5484D;
  --st-todo:var(--a1); --st-sent:var(--a2); --st-itv:var(--mid); --st-offer:var(--hi); --st-ko:var(--danger); --st-out:var(--lo);
  --b1:rgba(75,91,255,.30); --b2:rgba(154,91,255,.24); --b3:rgba(18,191,216,.22);
  --shadow:0 1px 1px rgba(16,20,43,.03),0 14px 34px -18px rgba(38,48,120,.34);
  --bar:rgba(255,255,255,.66); --blur:saturate(1.7) blur(22px);
  --num:"Syne",-apple-system,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --solid:#FFFFFF;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --r1:28px; --r2:22px; --r3:15px;
  --toast-bg:rgba(16,20,43,.92); --toast-ink:#fff; --toast-act:#9AA6FF;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#060918; --card:rgba(22,28,60,.55); --card-hi:rgba(24,31,66,.78); --edge:rgba(255,255,255,.08);
    --hair:rgba(255,255,255,.08); --sunk:rgba(255,255,255,.065); --track:rgba(255,255,255,.1);
    --ink:#F1F3FF; --ink-2:#A6ACCD; --ink-3:#6E7499;
    --a1:#7584FF; --a2:#B48CFF; --a3:#3FDDEE;
    --hi:#36E2A3; --mid:#FFC34F; --lo:#6E7499; --danger:#FF6B6E;
    --b1:rgba(75,91,255,.40); --b2:rgba(154,91,255,.30); --b3:rgba(18,191,216,.20);
    --shadow:0 18px 40px -22px rgba(0,0,0,.75);
    --bar:rgba(14,19,44,.6); --solid:#151C3E;
    --toast-bg:rgba(241,243,255,.94); --toast-ink:#10142B; --toast-act:#4B5BFF;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.45 var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ---------- Aurore ---------- */
.aurora{position:fixed;inset:-25%;z-index:-1;pointer-events:none;
  background:radial-gradient(36% 28% at 18% 14%,var(--b1),transparent 70%),radial-gradient(32% 26% at 88% 30%,var(--b2),transparent 70%),radial-gradient(44% 34% at 55% 96%,var(--b3),transparent 72%)}
.sheet .aurora,.tri .aurora{position:absolute;z-index:0}

.glass{background:var(--bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--edge);box-shadow:var(--shadow)}

/* ---------- Accueil ---------- */
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 118px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.top h1{font:800 31px/1.08 var(--display);letter-spacing:-.03em;margin:0}
.top p{margin:5px 0 0;color:var(--ink-2);font-size:15px}
.tools{display:flex;gap:8px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;padding:0;color:var(--ink)}
.ib.on{color:var(--a1)}
.ib:active,.rb:active,.go:active{transform:scale(.94)}
.avatar{background:var(--grad);color:#fff;font:700 17px/1 var(--num);border:0;box-shadow:0 8px 20px -10px rgba(75,91,255,.8)}
.hint{border-radius:var(--r3);padding:13px 15px;font-size:14px;color:var(--ink-2);margin-bottom:12px}
.hint b{color:var(--ink)}

.hero{display:flex;gap:16px;align-items:center;width:100%;text-align:left;border-radius:var(--r1);padding:16px 16px 16px 16px;margin-bottom:12px;color:inherit}
.hero .cd{flex:0 0 72px;height:72px;border-radius:22px;display:grid;place-content:center;text-align:center;background:color-mix(in srgb,var(--mid) 16%,transparent);color:var(--mid);font:700 25px/1 var(--num);letter-spacing:-.02em}
.hero .cd small{display:block;font:650 11.5px/1 var(--text);letter-spacing:0;margin-top:5px;opacity:.9}
.hero .tx{flex:1;min-width:0}
.hero b{display:block;font-size:16.5px;font-weight:700;line-height:1.25}
.hero span{display:block;color:var(--ink-2);font-size:14.5px;margin-top:3px}
.hero > svg{color:var(--ink-3)}

.trig{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;border:0;text-align:left;color:#fff;background:var(--grad);border-radius:var(--r1);padding:16px;margin-bottom:12px;box-shadow:0 20px 40px -20px rgba(75,91,255,.85)}
.trig::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 140% at 100% 0%,rgba(255,255,255,.32),transparent 60%);pointer-events:none}
.stk{display:flex;flex:0 0 auto}
.stk span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 12.5px/1 var(--num);letter-spacing:-.03em;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.6);margin-left:-12px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.stk span:first-child{margin-left:0}
.trig .tx{flex:1;min-width:0}
.trig b{display:block;font-size:17px;font-weight:750}
.trig small{display:block;font-size:13.5px;opacity:.88;margin-top:1px}
.trig .go{position:relative;z-index:1;flex:0 0 auto;background:#fff;color:#3B3FD6;font-weight:750;font-size:14px;border-radius:999px;padding:9px 15px}

.search{display:flex;align-items:center;gap:9px;height:44px;border-radius:var(--r3);padding:0 14px;margin:4px 0 16px;background:var(--sunk);color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}

.list{display:flex;flex-direction:column;gap:10px}
.gh{display:flex;align-items:center;gap:8px;margin:12px 4px 0;font-size:14px;font-weight:650;color:var(--ink-2)}
.gh:first-child{margin-top:0}
.gh .d{width:8px;height:8px;border-radius:50%;background:var(--c)}
.gh .n{color:var(--ink-3);font-weight:500}

.card{position:relative;display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;border-radius:var(--r2);padding:14px 16px 14px 14px;background:var(--card-hi);border:1px solid var(--edge);box-shadow:var(--shadow);color:inherit;transition:transform .15s}
.card:active{transform:scale(.985)}
.cring{position:relative;flex:0 0 54px;height:54px}
.cring b,.bigring b{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:700 16px/1 var(--num);color:var(--ink);letter-spacing:-.02em}
.cbody{flex:1;min-width:0}
.card h3{margin:2px 20px 3px 0;font-size:16px;font-weight:650;line-height:1.25;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{margin:0;display:flex;flex-wrap:wrap;gap:2px 10px;font-size:14px;color:var(--ink-2)}
.cmeta .co{color:var(--ink);font-weight:550}
.cmeta .loc{display:inline-flex;align-items:center;gap:3px}
.cmeta svg.i{width:13px;height:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:650;padding:4px 9px;border-radius:9px;background:var(--sunk);color:var(--ink-2)}
.chip.new{background:var(--grad);color:#fff}
.chip.c{background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.card.unseen::after{content:"";position:absolute;top:17px;right:15px;width:9px;height:9px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 16%,transparent)}

.ring .arc{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring.grow .arc{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{stroke-dashoffset:var(--c)}}

.empty{text-align:center;padding:48px 24px;color:var(--ink-2)}
.empty b{display:block;font:800 21px/1.2 var(--display);color:var(--ink);margin-bottom:6px;letter-spacing:-.02em}
.skel{height:86px;border-radius:var(--r2);background:linear-gradient(90deg,var(--card),var(--sunk),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- Barre d'onglets ---------- */
.tabbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);z-index:5;display:flex;gap:4px;padding:6px;border-radius:30px;width:min(420px,calc(100% - 32px))}
.tbtn{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;border-radius:24px;padding:8px 4px 7px;color:var(--ink-3);font-size:11.5px;font-weight:650}
.tbtn svg.i{width:22px;height:22px}
.tbtn[aria-pressed=true]{background:var(--sunk);color:var(--ink)}
.tbtn[aria-pressed=true] svg{color:var(--a1)}
.tbtn i{position:absolute;top:3px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--grad);color:#fff;font:700 11px/18px var(--text);font-style:normal;text-align:center}

/* ---------- Tirer pour actualiser ---------- */
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);z-index:6;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--a1);transform:translate(-50%,-60px);opacity:0;transition:transform .25s,opacity .25s;pointer-events:none}
.ptr.drag{transition:none}
.ptr.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- Fiche ---------- */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.86,.24,1);overflow:hidden}
.sheet.open{transform:none}
.scroller{position:absolute;inset:0;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.nav{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 6px) 14px 6px 6px;
  background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.back{display:flex;align-items:center;gap:1px;border:0;background:none;color:var(--a1);font-size:17px;padding:8px}
.back svg.i{width:25px;height:25px;stroke-width:2.4}
.d{max-width:640px;margin:0 auto;padding:6px 16px calc(env(safe-area-inset-bottom) + 132px)}
.dhero{display:flex;align-items:center;gap:18px;margin-top:4px}
.bigring{position:relative;flex:0 0 116px;height:116px;filter:drop-shadow(0 8px 22px color-mix(in srgb,var(--t) 42%,transparent))}
.bigring b{font-size:38px;font-weight:700;letter-spacing:-.05em}
.bigring b small{display:block;font:600 12px/1 var(--text);color:var(--ink-3);letter-spacing:0;margin-top:5px}
.tier{display:inline-flex;align-items:center;font-size:13px;font-weight:750;color:color-mix(in srgb,var(--t) 82%,var(--ink));background:color-mix(in srgb,var(--t) 15%,transparent);padding:5px 11px;border-radius:999px}
.why{margin:9px 0 0;font-size:15px;line-height:1.45;color:var(--ink-2)}
.d h2{font:800 27px/1.14 var(--display);letter-spacing:-.03em;margin:22px 0 4px}
.firm{margin:0;font-size:17px;font-weight:600}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fact{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:12px;background:var(--sunk);font-size:14px;color:var(--ink-2)}
.fact svg.i{width:15px;height:15px;color:var(--ink-3)}

.pipe{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin-top:22px;padding:16px 6px 13px;border-radius:var(--r2)}
.pipe::before,.pipe::after{content:"";position:absolute;left:12.5%;top:31px;height:3px;border-radius:2px}
.pipe::before{right:12.5%;background:var(--track)}
.pipe::after{width:calc(75% * var(--p,0));background:var(--grad);transition:width .45s cubic-bezier(.2,.86,.24,1)}
.pipe.closed{opacity:.5}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;padding:0;color:var(--ink-3);font-size:12.5px;font-weight:650}
.node .pt{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card-hi);border:2px solid var(--track);color:#fff;transition:.25s}
.node .pt svg.i{width:16px;height:16px;stroke-width:3}
.node.past{color:var(--ink-2)}
.node.past .pt{background:var(--a1);border-color:var(--a1)}
.node.now{color:var(--ink)}
.node.now .pt{background:var(--c);border-color:var(--c);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 22%,transparent)}
.node.now .pt::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.alt{display:flex;justify-content:center;gap:4px;margin-top:6px}
.alt button{border:0;background:none;color:var(--ink-3);font-size:14px;font-weight:600;padding:7px 10px}
.closed-msg{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:11px 12px 11px 15px;border-radius:var(--r3);background:color-mix(in srgb,var(--c) 13%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--ink));font-weight:650;font-size:15px}
.since{text-align:center;font-size:13.5px;color:var(--ink-3);margin:6px 0 0}

.seg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);padding:4px;border-radius:17px;background:var(--sunk);margin:24px 0 2px}
.seg .ind{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 4);border-radius:13px;background:var(--card-hi);box-shadow:var(--shadow);transform:translateX(calc(var(--i,0) * 100%));transition:transform .32s cubic-bezier(.2,.86,.24,1)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:9px 2px;font-size:13.5px;font-weight:650;color:var(--ink-3);border-radius:13px}
.seg button[aria-selected=true]{color:var(--ink)}

.blk{margin-top:12px;border-radius:var(--r2);background:var(--card-hi);border:1px solid var(--edge);box-shadow:var(--shadow);overflow:hidden}
.bh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px 2px}
.bh h3,details.blk > summary h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.bb{padding:8px 16px 16px;font-size:15.5px;line-height:1.55;white-space:pre-wrap}
.blk.pitch{background:var(--grad);color:#fff;border:0;box-shadow:0 20px 40px -22px rgba(75,91,255,.8)}
.blk.pitch .bb{font-size:17px;line-height:1.5}
details.blk > summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:15px 16px;cursor:pointer}
details.blk > summary::-webkit-details-marker{display:none}
details.blk > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
details[open].blk > summary::after{transform:rotate(-135deg)}
details.blk .bb{padding-top:0}
.pempty{text-align:center;color:var(--ink-3);padding:30px 18px;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;padding:8px 16px 16px;font-size:15px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;text-align:right}

.itvb{border:1.5px solid color-mix(in srgb,var(--mid) 60%,transparent);margin-top:16px}
.when{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.when .j{flex:0 0 62px;height:62px;border-radius:19px;display:grid;place-items:center;background:color-mix(in srgb,var(--mid) 16%,transparent);color:var(--mid);font:700 20px/1 var(--num)}
.when strong{display:block;font-size:17px}
.when span{color:var(--ink-2);font-size:14.5px}

.dock{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:4;max-width:616px;margin:0 auto;display:flex;gap:8px;padding:8px;border-radius:27px}
.go{flex:1;border:0;border-radius:20px;background:var(--grad);color:#fff;font-weight:750;font-size:16px;padding:15px;box-shadow:0 12px 26px -14px rgba(75,91,255,.9)}
.sq{flex:0 0 62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:20px;background:var(--sunk);color:var(--ink);font-size:11.5px;font-weight:650;text-decoration:none}
.sq[aria-disabled=true]{opacity:.35;pointer-events:none}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r3);padding:13px 16px;background:var(--sunk);color:var(--ink);font-weight:650;font-size:15px;text-decoration:none}
.btn.pri{background:var(--grad);color:#fff}
.btn.ghost{background:none;color:var(--ink-2)}
.btn.danger{background:none;color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row > *{flex:1 1 140px}
.mini{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:999px;padding:7px 13px;background:var(--sunk);font-size:13.5px;font-weight:650;color:var(--ink);text-decoration:none;white-space:nowrap}
.mini svg.i{width:15px;height:15px}
.mini.ok{background:var(--hi);color:#fff}
.blk.pitch .mini{background:rgba(255,255,255,.2);color:#fff}
textarea,.dt,.field input{width:100%;border:1px solid var(--hair);border-radius:var(--r3);background:var(--sunk);padding:12px 14px;font-size:16px;color:var(--ink);outline:none}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.dt{-webkit-appearance:none;min-height:48px}

/* ---------- Tri ---------- */
.tri{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 20px);opacity:0;pointer-events:none;transition:opacity .25s;overflow:hidden}
.tri.open{opacity:1;pointer-events:auto}
.tri > :not(.aurora){position:relative;z-index:1}
.tri-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tri-top span{font-weight:650;color:var(--ink-2);font-size:15px}
.prog{height:4px;border-radius:2px;background:var(--track);margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--grad);border-radius:2px;transition:width .3s}
.deck{flex:1;margin:18px 0 16px;min-height:0}
.tcard{position:absolute;inset:0;border-radius:32px;padding:26px 22px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;
  background:var(--solid);border:1px solid var(--edge);box-shadow:0 30px 60px -30px rgba(38,48,120,.5);touch-action:none;-webkit-user-select:none;user-select:none;will-change:transform;transition:transform .32s cubic-bezier(.2,.86,.24,1)}
.tcard.back{transform:translateY(18px) scale(.93);opacity:.6;pointer-events:none;filter:saturate(.6)}
.tcard.front{animation:rise .38s cubic-bezier(.2,.86,.24,1)}
@keyframes rise{from{transform:translateY(18px) scale(.93);opacity:.55}}
.tcard .bigring{flex-basis:132px;width:132px;height:132px}
.tcard .bigring b{font-size:44px}
.tcard .tier{margin-top:16px}
.tcard h2{font:800 25px/1.18 var(--display);letter-spacing:-.03em;margin:14px 0 4px;overflow-wrap:anywhere}
.tcard .facts{justify-content:center}
.tcard .why{margin-top:16px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.stamp{position:absolute;top:24px;padding:7px 13px;border-radius:12px;font:700 18px/1 var(--num);border:3px solid;pointer-events:none}
.stamp.keep{left:20px;color:var(--hi);opacity:var(--k,0);transform:rotate(-12deg)}
.stamp.out{right:20px;color:var(--danger);opacity:var(--o,0);transform:rotate(12deg)}
.tri-actions{display:flex;align-items:center;justify-content:center;gap:20px}
.rb{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;padding:0;border:1px solid var(--edge);background:var(--card-hi);box-shadow:var(--shadow)}
.rb svg.i{width:28px;height:28px;stroke-width:2.6}
.rb.out{color:var(--danger)}
.rb.keep{width:76px;height:76px;border:0;background:var(--grad);color:#fff;box-shadow:0 16px 32px -14px rgba(75,91,255,.9)}
.rinfo{border:0;background:var(--sunk);color:var(--ink);font-weight:650;font-size:14px;padding:11px 16px;border-radius:999px}
.tri-hint{text-align:center;color:var(--ink-3);font-size:13px;margin:12px 0 0}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.done .ok{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff;box-shadow:0 20px 44px -18px rgba(75,91,255,.9)}
.done .ok svg.i{width:44px;height:44px;stroke-width:2.8}
.done h2{font:800 28px/1.1 var(--display);margin:14px 0 0;letter-spacing:-.03em}
.done p{color:var(--ink-2);margin:0 0 14px}

/* ---------- Panneaux ---------- */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;background:rgba(6,9,24,.42);opacity:0;pointer-events:none;transition:opacity .22s}
.modal.open{opacity:1;pointer-events:auto}
.panel{width:100%;max-width:640px;margin:0 auto;background:var(--bg);border-radius:30px 30px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow-y:auto;transform:translateY(40px);transition:transform .28s cubic-bezier(.2,.86,.24,1)}
.modal.open .panel{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ink-3);opacity:.35;margin:0 auto 14px}
.panel h2{font:800 25px/1.1 var(--display);letter-spacing:-.025em;margin:0}
.panel .sub{color:var(--ink-2);font-size:15px;margin:6px 0 4px}
.step{display:flex;gap:12px;align-items:center;border-radius:var(--r2);padding:14px;margin-top:10px;background:var(--card-hi);border:1px solid var(--edge);box-shadow:var(--shadow)}
.step .num{flex:0 0 34px;height:34px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font:700 15px/1 var(--num)}
.step.done .num{background:var(--hi);color:#fff}
.step .tx{flex:1;min-width:0}.step .tx b{display:block;font-size:15.5px}.step .tx span{font-size:13.5px;color:var(--ink-2)}
.copyrow{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--hair)}
.copyrow > div{flex:1;min-width:0}
.copyrow .l{font-size:13px;color:var(--ink-3)}
.copyrow .v{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:block;margin-top:12px}.field span{display:block;font-size:13px;color:var(--ink-3);margin-bottom:5px}

/* ---------- Connexion ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:380px;margin:0 auto;padding:24px}
.login h1{font:800 34px/1 var(--num);letter-spacing:-.03em;margin:10px 0 0}
.login p{color:var(--ink-2);margin:0}
.login input{width:100%;border:1px solid var(--edge);border-radius:var(--r2);background:var(--card-hi);box-shadow:var(--shadow);padding:18px;font:700 26px/1 var(--num);text-align:center;letter-spacing:.4em;outline:none;color:var(--ink)}
.err{color:var(--danger);font-size:14px;min-height:20px}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translate(-50%,14px);opacity:0;z-index:60;display:flex;align-items:center;gap:14px;white-space:nowrap;
  padding:11px 12px 11px 16px;border-radius:16px;background:var(--toast-bg);color:var(--toast-ink);font-size:14.5px;font-weight:600;transition:.25s;pointer-events:none;box-shadow:0 14px 34px -14px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:var(--toast-act);font-weight:750;padding:2px 4px}
.flash{animation:fl 1.4s ease}@keyframes fl{0%,45%{box-shadow:0 0 0 6px color-mix(in srgb,var(--mid) 40%,transparent)}100%{box-shadow:var(--shadow)}}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="ptr glass" id="ptr" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></div>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ================= Configuration =================
const STATUTS = [
  { k: "À postuler", c: "--st-todo" }, { k: "Postulé", c: "--st-sent" }, { k: "Entretien", c: "--st-itv" },
  { k: "Offre", c: "--st-offer" }, { k: "Refus", c: "--st-ko" }, { k: "Écartée", c: "--st-out" },
];
const PIPE = ["À postuler", "Postulé", "Entretien", "Offre"];
const stColor = (s) => `var(${(STATUTS.find((x) => x.k === s) || STATUTS[0]).c})`;
const TABS = [
  { k: "todo", label: "À traiter", icon: "inbox", match: (s) => s === "À postuler" },
  { k: "live", label: "En cours", icon: "pulse", match: (s) => ["Postulé", "Entretien", "Offre"].includes(s) },
  { k: "arch", label: "Archives", icon: "archive", match: (s) => ["Refus", "Écartée"].includes(s) },
];
const SEGS = [{ k: "apply", label: "Postuler" }, { k: "prep", label: "Préparer" }, { k: "firm", label: "Entreprise" }, { k: "notes", label: "Notes" }];
const DEMO = new URLSearchParams(location.search).has("demo");
const isStandalone = () => window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const DEFAULT_ME = { prenom: "Lucas", email: "lucas.verdier@hotmail.com", tel: "06 34 25 51 93", linkedin: "linkedin.com/in/lucas-verdier" };

const state = {
  pin: (() => { try { return localStorage.getItem("pin") || ""; } catch { return ""; } })(),
  offres: [], tab: ls.get("tab3", "todo"), q: "", loading: false, current: null, seg: {},
  me: { ...DEFAULT_ME, ...ls.get("me", {}) }, seen: ls.get("seen", null), applying: false, triage: null,
};

// ================= Utilitaires =================
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const find = (id) => state.offres.find((x) => x.id === id);
const statut = (o) => o.Statut || "À postuler";
const score = (o) => Math.max(0, Math.min(100, Number(o.Score) || 0));
const tierColor = (s) => (s >= 75 ? "var(--hi)" : s >= 60 ? "var(--mid)" : "var(--lo)");
const tierLabel = (s) => (s >= 80 ? "Excellent match" : s >= 70 ? "Très bon match" : s >= 60 ? "Bon match" : "Match faible");
const fmtDay = (d) => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
const fmtShort = (d) => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
const fmtLongDay = (d) => d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
const fmtTime = (d) => d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
const fmtItv = (d) => d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) + " à " + fmtTime(d);
const itvDate = (o) => (statut(o) === "Entretien" && o["Date entretien"] ? new Date(o["Date entretien"]) : null);
const daysUntil = (d) => { const a = new Date(); a.setHours(0, 0, 0, 0); const b = new Date(d); b.setHours(0, 0, 0, 0); return Math.round((b - a) / 86400000); };
const jLabel = (j) => (j === 0 ? "Auj." : "J-" + j);
const toLocalInput = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const appliedDate = (o) => (["Postulé", "Entretien", "Offre", "Refus"].includes(statut(o)) ? o["Date de candidature"] : null);
const isNew = (o) => !!state.seen && !state.seen.includes(o.id) && statut(o) === "À postuler";
function markSeen(id) { if (!state.seen) state.seen = []; if (!state.seen.includes(id)) { state.seen.push(id); ls.set("seen", state.seen.slice(-2000)); } }
const greet = () => { const h = new Date().getHours(); return h >= 5 && h < 18 ? "Bonjour" : "Bonsoir"; };
const nextHarvest = () => { const d = new Date(), m = d.getHours() * 60 + d.getMinutes(); return m < 715 ? "vers 12 h" : m < 1025 ? "vers 17 h" : "demain vers 12 h"; };

const I = {
  back: '<path d="M15 18l-6-6 6-6"/>', chev: '<path d="m9 18 6-6-6-6"/>', check: '<path d="M20 6 9 17l-5-5"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>',
  bell: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  doc: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>',
  ext: '<path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>',
  euro: '<path d="M18 7a7 7 0 1 0 0 10"/><path d="M4 10h10M4 14h10"/>', brief: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  pulse: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>', archive: '<rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
};
const icon = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
function ring(s, size, stroke, cls = "") {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - s / 100), m = size / 2;
  return `<svg class="ring ${cls}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
    <circle class="arc" cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--t)" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" style="--c:${c.toFixed(2)}" transform="rotate(-90 ${m} ${m})"/></svg>`;
}
const fact = (ic, v) => (v ? `<span class="fact">${icon(ic)}${esc(v)}</span>` : "");

let toastTimer;
function toast(msg, undo) {
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Annuler</button>' : ""}`;
  if (undo) t.querySelector("button").onclick = () => { t.classList.remove("show"); undo(); };
  t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), undo ? 4500 : 2200);
}
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement("textarea"); t.value = text; t.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  if (btn) { const old = btn.innerHTML; btn.textContent = "Copié"; btn.classList.add("ok"); setTimeout(() => { btn.innerHTML = old; btn.classList.remove("ok"); }, 1400); }
  else toast("Copié");
}
async function api(path, opts = {}) {
  if (DEMO) return demoApi(path, opts);
  const res = await fetch(path, { ...opts, headers: { "content-type": "application/json", "x-app-pin": state.pin, ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { logout(); throw new Error("Code d'accès invalide"); }
  if (!res.ok) throw new Error(data.error || "Connexion impossible, réessaie dans un instant");
  return data;
}

// ================= Connexion =================
const LOGO = `<svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4B5BFF"/><stop offset=".6" stop-color="#8B4DFF"/><stop offset="1" stop-color="#10B4CE"/></linearGradient></defs>
  <rect width="84" height="84" rx="22" fill="#0B1030"/><circle cx="42" cy="42" r="23" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="7"/>
  <circle cx="42" cy="42" r="23" fill="none" stroke="url(#lg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="144.5" stroke-dashoffset="36" transform="rotate(-90 42 42)"/><circle cx="42" cy="42" r="5" fill="#fff"/></svg>`;
function renderLogin(err = "") {
  $("#app").innerHTML = `
    <form class="login" id="login">
      ${LOGO}
      <h1>Candidatures</h1>
      <p>Tape ton code d'accès pour retrouver tes offres.</p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••" aria-label="Code d'accès" required>
      <div class="err">${esc(err)}</div>
      <button class="btn pri" type="submit" style="padding:15px">Ouvrir mes offres</button>
    </form>`;
  $("#login").onsubmit = async (e) => {
    e.preventDefault(); state.pin = $("#pin").value.trim();
    try { await load(); try { localStorage.setItem("pin", state.pin); } catch {} render(); openFromUrl(); }
    catch (er) { renderLogin(er.message); }
  };
}
function logout() { try { localStorage.removeItem("pin"); } catch {} state.pin = ""; renderLogin("Code incorrect ou modifié, tape-le à nouveau."); }

// ================= Données =================
async function load() {
  state.loading = true;
  try {
    const { offres } = await api("/api/offres");
    state.offres = offres || [];
    if (state.seen === null) { state.seen = state.offres.map((o) => o.id); ls.set("seen", state.seen); }
  } finally { state.loading = false; }
}
const matchQ = (o) => { const q = state.q.trim().toLowerCase(); return !q || [o["Intitulé"], o.Entreprise, o.Ville].join(" ").toLowerCase().includes(q); };
const byRecent = (k) => (a, b) => new Date(b[k] || b.createdTime || 0) - new Date(a[k] || a.createdTime || 0);
function nextInterview() {
  return state.offres.map((o) => ({ o, d: itvDate(o) })).filter((x) => x.d && daysUntil(x.d) >= 0).sort((a, b) => a.d - b.d)[0];
}

// ================= Accueil =================
function render() {
  if (!state.pin && !DEMO) return renderLogin();
  const tab = TABS.find((t) => t.k === state.tab) || TABS[0];
  const fresh = state.offres.filter(isNew).sort((a, b) => score(b) - score(a));
  const next = nextInterview();
  const notifOn = typeof Notification !== "undefined" && Notification.permission === "granted";
  const todayTxt = new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  $("#app").innerHTML = `
  <main class="wrap">
    <header class="top">
      <div><h1>${greet()} ${esc(state.me.prenom || "")}</h1><p>${todayTxt.charAt(0).toUpperCase() + todayTxt.slice(1)}</p></div>
      <div class="tools">
        <button class="ib glass ${notifOn ? "on" : ""}" id="bell" aria-label="${notifOn ? "Notifications activées" : "Activer les notifications"}">${icon("bell")}</button>
        <button class="ib avatar" id="me" aria-label="Mes coordonnées">${esc((state.me.prenom || "?").charAt(0).toUpperCase())}</button>
      </div>
    </header>
    ${!isStandalone() && !DEMO ? `<div class="hint glass"><b>Installe l'app</b> pour recevoir les notifications : Partager, puis « Sur l'écran d'accueil ».</div>` : ""}
    ${next && daysUntil(next.d) <= 14 ? (() => { const j = daysUntil(next.d); return `
      <button class="hero glass" data-id="${next.o.id}">
        <div class="cd">${jLabel(j)}<small>${j === 0 ? "c'est le jour" : j === 1 ? "demain" : "jours"}</small></div>
        <div class="tx"><b>Entretien chez ${esc(next.o.Entreprise || "")}</b><span>${esc(fmtItv(next.d))}</span></div>${icon("chev")}
      </button>`; })() : ""}
    ${fresh.length ? `
      <button class="trig" id="triage">
        <div class="stk">${fresh.slice(0, 3).map((o) => `<span>${score(o)}</span>`).join("")}</div>
        <div class="tx"><b>${fresh.length} nouvelle${fresh.length > 1 ? "s" : ""} offre${fresh.length > 1 ? "s" : ""}</b><small>Garde ou écarte en un geste</small></div>
        <span class="go">Trier</span>
      </button>` : ""}
    <label class="search">${icon("search")}<input id="q" type="search" placeholder="Poste, entreprise, ville" value="${esc(state.q)}" aria-label="Rechercher"></label>
    <div class="list">${listHTML(tab)}</div>
  </main>
  <nav class="tabbar glass" aria-label="Sections">${TABS.map((t) => {
    const badge = t.k === "todo" && fresh.length ? `<i>${fresh.length}</i>` : "";
    return `<button class="tbtn" data-t="${t.k}" aria-pressed="${t.k === tab.k}">${icon(t.icon)}<span>${t.label}</span>${badge}</button>`; }).join("")}</nav>`;
  const qi = $("#q");
  qi.oninput = () => { state.q = qi.value; const pos = qi.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
  $$(".tbtn").forEach((b) => (b.onclick = () => { state.tab = b.dataset.t; ls.set("tab3", state.tab); render(); window.scrollTo({ top: 0 }); }));
  $$(".card, .hero").forEach((b) => (b.onclick = () => openDetail(b.dataset.id)));
  const tr = $("#triage"); if (tr) tr.onclick = openTriage;
  $("#bell").onclick = enableNotifications;
  $("#me").onclick = openMe;
}

function listHTML(tab) {
  if (state.loading && !state.offres.length) return '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  const items = state.offres.filter((o) => tab.match(statut(o)) && matchQ(o));
  if (!items.length) return emptyHTML(tab.k);
  if (tab.k === "todo") return items.sort((a, b) => (isNew(b) - isNew(a)) || (score(b) - score(a))).map((o) => card(o, tab.k)).join("");
  const groups = tab.k === "live"
    ? [{ k: "Entretien", label: "Entretiens", sort: (a, b) => new Date(a["Date entretien"] || 8.64e15) - new Date(b["Date entretien"] || 8.64e15) },
       { k: "Offre", label: "Propositions reçues", sort: byRecent("Date de candidature") },
       { k: "Postulé", label: "Candidatures envoyées", sort: byRecent("Date de candidature") }]
    : [{ k: "Refus", label: "Refus", sort: byRecent("Date de candidature") }, { k: "Écartée", label: "Offres écartées", sort: byRecent("createdTime") }];
  return groups.map((g) => {
    const list = items.filter((o) => statut(o) === g.k).sort(g.sort);
    return list.length ? `<h4 class="gh" style="--c:${stColor(g.k)}"><span class="d"></span>${g.label}<span class="n">${list.length}</span></h4>${list.map((o) => card(o, tab.k)).join("")}` : "";
  }).join("");
}
function emptyHTML(k) {
  if (state.q) return `<div class="empty"><b>Aucun résultat</b>Rien ne correspond à « ${esc(state.q)} » ici.</div>`;
  const m = { todo: ["Tout est traité", `Les prochaines offres arrivent ${nextHarvest()}.`],
    live: ["Aucune candidature en cours", "Ouvre une offre et touche Postuler pour la suivre ici."],
    arch: ["Archives vides", "Les refus et les offres écartées arriveront ici."] }[k];
  return `<div class="empty"><b>${m[0]}</b>${m[1]}</div>`;
}
function card(o, tabK) {
  const s = score(o), itv = itvDate(o), ap = appliedDate(o), nw = isNew(o);
  const chips = [

function bindDrag(el) {
  let x0 = null, y0 = 0, dx = 0, dy = 0;
  el.addEventListener("pointerdown", (e) => { x0 = e.clientX; y0 = e.clientY; dx = dy = 0; el.setPointerCapture(e.pointerId); el.style.transition = "none"; });
  el.addEventListener("pointermove", (e) => {
    if (x0 === null) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    el.style.transform = `translate(${dx}px,${dy * 0.25}px) rotate(${dx / 18}deg)`;
    el.style.setProperty("--k", Math.max(0, Math.min(1, dx / 110)));
    el.style.setProperty("--o", Math.max(0, Math.min(1, -dx / 110)));
  });
  const end = () => {
    if (x0 === null) return; x0 = null; el.style.transition = "";
    if (dx > 110) fling(el, true); else if (dx < -110) fling(el, false);
    else { el.style.transform = ""; el.style.setProperty("--k", 0); el.style.setProperty("--o", 0); }
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}
function fling(el, keep) {
  if (!el || el.dataset.gone) return; el.dataset.gone = 1;
  el.style.setProperty(keep ? "--k" : "--o", 1);
  el.style.transform = `translate(${keep ? 130 : -130}vw,-30px) rotate(${keep ? 24 : -24}deg)`;
  setTimeout(() => decide(keep), 260);
}
function decide(keep) {
  const tr = state.triage; if (!tr) return;
  const o = find(tr.ids[tr.i]);
  if (o) {
    markSeen(o.id);
    if (keep) tr.kept++;
    else {
      tr.out++;
      const f = fieldsForStatut(o, "Écartée"), before = { Statut: statut(o) };
      save(o.id, f, "Offre écartée", { undo: () => { save(o.id, before, "Offre remise à postuler"); tr.out--; } });
    }
  }
  tr.i++; renderTriage();
}

// ================= Statuts et enregistrement =================
function fieldsForStatut(o, s) {
  const f = { Statut: s };
  if (["Postulé", "Entretien", "Offre"].includes(s) && !o["Date de candidature"]) f["Date de candidature"] = today();
  if (["À postuler", "Écartée"].includes(s) && o["Date de candidature"]) f["Date de candidature"] = "";
  if (!["Entretien", "Offre"].includes(s) && o["Date entretien"]) f["Date entretien"] = "";
  return f;
}
function setStatut(id, s) {
  const o = find(id);
  if (!o || statut(o) === s) return;
  const f = fieldsForStatut(o, s), before = {};
  Object.keys(f).forEach((k) => (before[k] = o[k] ?? ""));
  if (!o.Statut) before.Statut = "À postuler";
  save(id, f, `Statut : ${s}`, { undo: () => save(id, before, "Modification annulée"), focusItv: s === "Entretien" });
}
function applyLocal(id, fields) {
  const i = state.offres.findIndex((x) => x.id === id); if (i < 0) return;
  const o = { ...state.offres[i] };
  for (const [k, v] of Object.entries(fields)) { if (v === "" || v == null) delete o[k]; else o[k] = v; }
  state.offres[i] = o;
}
async function save(id, fields, msg, opts = {}) {
  const snapshot = state.offres.map((o) => ({ ...o }));
  applyLocal(id, fields);
  if (state.current === id) openDetail(id, { focusItv: opts.focusItv }); else if (!state.triage) render();
  toast(msg, opts.undo);
  try {
    const { offre } = await api("/api/offre-update", { method: "POST", body: JSON.stringify({ id, fields }) });
    const i = state.offres.findIndex((x) => x.id === id);
    if (i >= 0 && offre) state.offres[i] = { ...offre, createdTime: offre.createdTime || state.offres[i].createdTime };
  } catch (e) {
    state.offres = snapshot;
    if (state.current === id) openDetail(id); else if (!state.triage) render();
    toast("Pas enregistré : " + e.message);
  }
}
async function openFromUrl() {
  const id = new URLSearchParams(location.search).get("id");
  if (!id) return;
  if (!find(id)) { try { const { offre } = await api("/api/offres?id=" + id); if (offre) state.offres.unshift(offre); } catch {} }
  openDetail(id);
}

// ================= Notifications =================
function b64ToUint8(b64) { const p = "=".repeat((4 - (b64.length % 4)) % 4); const raw = atob((b64 + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(raw, (c) => c.charCodeAt(0)); }
async function enableNotifications() {
  if (DEMO) return toast("Notifications indisponibles en démo");
  if (!isStandalone()) return toast("Ajoute d'abord l'app à l'écran d'accueil, puis ouvre-la depuis l'icône");
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return toast("Mets ton iPhone à jour (iOS 16.4 minimum)");
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") return toast("Notifications refusées : Réglages, Notifications, Candidatures");
    const reg = await navigator.serviceWorker.ready;
    const { publicKey } = await api("/api/push-config");
    if (!publicKey) return toast("Clé de notification manquante sur Netlify");
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToUint8(publicKey) }));
    await api("/api/subscribe", { method: "POST", body: JSON.stringify({ subscription: sub }) });
    toast("Notifications activées"); render();
  } catch (e) { toast("Activation impossible : " + e.message); }
}

// ================= Tirer pour actualiser =================
let ptrY = null, ptrD = 0;
const ptrBlocked = () => state.current || state.triage || ($("#modal") && $("#modal").classList.contains("open")) || (!state.pin && !DEMO);
window.addEventListener("touchstart", (e) => { if (ptrBlocked() || window.scrollY > 0) { ptrY = null; return; } ptrY = e.touches[0].clientY; ptrD = 0; }, { passive: true });
window.addEventListener("touchmove", (e) => {
  if (ptrY === null) return;
  ptrD = Math.max(0, e.touches[0].clientY - ptrY);
  const p = $("#ptr"); p.classList.add("drag");
  p.style.transform = `translate(-50%,${Math.min(ptrD, 130) * 0.55 - 60}px)`; p.style.opacity = Math.min(1, ptrD / 80);
  p.querySelector("svg").style.transform = `rotate(${ptrD * 2.5}deg)`;
}, { passive: true });
window.addEventListener("touchend", async () => {
  if (ptrY === null) return; ptrY = null;
  const p = $("#ptr"); p.classList.remove("drag");
  if (ptrD > 85) {
    p.style.transform = "translate(-50%,12px)"; p.classList.add("spin"); p.querySelector("svg").style.transform = "";
    try { await load(); render(); toast("Offres à jour"); } catch (e) { toast(e.message); }
    p.classList.remove("spin");
  }
  p.style.transform = ""; p.style.opacity = 0;
});
